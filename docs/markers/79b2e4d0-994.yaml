content: |
  TrendLock 40 CI regression root cause (2026-05-05): after canonical market data was introduced for EchoTrend, TrendLock 40 still had no primary `data_sources` entry. Local runs loaded legacy `~/.../BTC-USD_1h.csv` and produced full 2020+ backtests, but GitHub Actions lacked that legacy file and fell back to `fetch_historical_candles(..., limit=6000)`, only ~1000 days of 4H candles starting 2023-08. Because period summaries stored requested 3Y/5Y boundaries instead of actual available data starts, 3Y and 5Y appeared mislabeled/duplicated. Fix: declare TrendLock primary canonical source `BTC-USD_1h.csv` in manifest and add regression test that CI uses `load_local_history_by_name` before OKX fallback.
